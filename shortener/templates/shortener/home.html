<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input[type=url] { flex: 1; padding: .5rem .75rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #f4f4f4; border-radius: 4px; word-break: break-all; }
    .err { color: #b00020; }
    code { background: #eee; padding: .1rem .3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="f">
    <input type="url" name="url" id="url" placeholder="https://example.com/very/long/path" required>
    <button type="submit">Shorten</button>
  </form>
  <div id="out"></div>

  <script>
    const f = document.getElementById('f');
    const out = document.getElementById('out');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      out.innerHTML = '';
      const url = document.getElementById('url').value;
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url}),
      });
      const data = await res.json();
      if (!res.ok) {
        out.innerHTML = `<div class="result err">${data.error || 'error'}</div>`;
        return;
      }
      out.innerHTML = `
        <div class="result">
          <div><strong>Short URL:</strong> <a href="${data.short_url}">${data.short_url}</a></div>
        </div>`;
    });
  </script>
</body>
</html>
